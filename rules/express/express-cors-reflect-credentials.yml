rules:
  - id: express-cors-reflect-credentials
    message: >-
      CORS reflects the request Origin while `credentials: true`. Reflecting the
      origin together with credentials lets any site read authenticated
      responses. Use an explicit allow-list of origins.
    severity: ERROR
    languages: [typescript, javascript]
    metadata:
      category: security
      cwe:
        - "CWE-942: Permissive Cross-domain Policy with Untrusted Domains"
      owasp:
        - "A05:2021 - Security Misconfiguration"
      references:
        - https://developer.mozilla.org/en-US/docs/Web/HTTP/CORS#requests_with_credentials
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: "cors({ ..., origin: true, ..., credentials: true, ... })"
          - pattern: "cors({ ..., credentials: true, ..., origin: true, ... })"
          - pattern: |
              cors({ ..., origin: function (...) { ... $CB(null, $REQORIGIN); ... }, ..., credentials: true, ... })
          - pattern: |
              cors({ ..., credentials: true, ..., origin: function (...) { ... $CB(null, $REQORIGIN); ... }, ... })
